<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="shell navigation">
        <a class="wordmark" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Michael MacRaild</a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
          <a href="{{ '/spotlights/' | relative_url }}"{% if page.url == '/spotlights/' %} aria-current="page"{% endif %}>Research Spotlights</a>
          <a href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a>
          <a href="{{ '/news/' | relative_url }}"{% if page.url == '/news/' %} aria-current="page"{% endif %}>News</a>
          <a href="{{ '/cv/' | relative_url }}"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>CV</a>
        </nav>
      </div>
    </header>
    <main id="main-content" class="shell{% if page.url == '/' %} home-main{% endif %}" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="shell">&copy; {{ 'now' | date: '%Y' }} Michael MacRaild</div>
    </footer>
  </body>
</html>
